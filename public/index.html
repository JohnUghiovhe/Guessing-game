<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Guessing Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-a: #dceefc;
        --bg-b: #c4d9ee;
        --bg-c: #afc8e2;
        --panel: #f8fafc;
        --panel-strong: #ffffff;
        --text: #0b1322;
        --muted: #526176;
        --primary: #0f766e;
        --primary-deep: #0a4f5a;
        --accent: #f59e0b;
        --danger: #dc2626;
        --line: #dbe4ef;
        --ok: #16a34a;
        --focus-ring: rgba(14, 165, 164, 0.38);
        --hero-gradient-a: rgba(248, 250, 252, 0.96);
        --hero-gradient-b: rgba(255, 255, 255, 0.86);
        --panel-gradient-a: rgba(248, 250, 252, 0.98);
        --panel-gradient-b: rgba(240, 246, 251, 0.98);
        --surface: #ffffff;
        --surface-soft: #f8fbff;
        --surface-soft-alt: #f1fbf5;
        --shadow: rgba(3, 8, 20, 0.16);
        --checkbox-text: #223049;
      }

      :root[data-theme='dark'] {
        --bg-a: #051126;
        --bg-b: #102a43;
        --bg-c: #123850;
        --panel: #dce7f2;
        --panel-strong: #f8fbff;
        --text: #0b1322;
        --muted: #4e6077;
        --line: #cfdeee;
        --hero-gradient-a: rgba(248, 250, 252, 0.96);
        --hero-gradient-b: rgba(255, 255, 255, 0.86);
        --panel-gradient-a: rgba(248, 250, 252, 0.98);
        --panel-gradient-b: rgba(240, 246, 251, 0.98);
        --surface: #ffffff;
        --surface-soft: #f8fbff;
        --surface-soft-alt: #f1fbf5;
        --shadow: rgba(3, 8, 20, 0.28);
      }

      :root[data-theme='light'] {
        --bg-a: #dceefc;
        --bg-b: #c4d9ee;
        --bg-c: #afc8e2;
        --panel: #f8fbff;
        --panel-strong: #ffffff;
        --text: #0b1322;
        --muted: #4b6078;
        --line: #d2deec;
        --hero-gradient-a: rgba(255, 255, 255, 0.95);
        --hero-gradient-b: rgba(250, 252, 255, 0.92);
        --panel-gradient-a: rgba(255, 255, 255, 0.98);
        --panel-gradient-b: rgba(245, 250, 255, 0.98);
        --surface: #ffffff;
        --surface-soft: #f7faff;
        --surface-soft-alt: #eef9f2;
        --shadow: rgba(4, 16, 34, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 16% 10%, rgba(245, 158, 11, 0.28), transparent 42%),
          radial-gradient(circle at 88% 18%, rgba(59, 130, 246, 0.24), transparent 34%),
          linear-gradient(130deg, var(--bg-a), var(--bg-b) 48%, var(--bg-c));
        transition: background 0.25s ease;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 40px;
        display: grid;
        gap: 16px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, var(--hero-gradient-a), var(--hero-gradient-b));
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 22px;
        padding: 20px;
        box-shadow: 0 20px 55px var(--shadow);
        animation: fade-up 0.6s ease both;
      }

      .hero::after {
        content: '';
        position: absolute;
        right: -90px;
        top: -90px;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, rgba(15, 118, 110, 0.2), transparent 68%);
        pointer-events: none;
      }

      .hero-row {
        display: flex;
        gap: 14px;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      .title {
        font-family: 'Space Grotesk', 'Outfit', sans-serif;
        font-size: clamp(1.55rem, 2.5vw, 2.2rem);
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .status-grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(3, minmax(130px, 1fr));
        gap: 10px;
      }

      .status-card {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .status-label {
        margin: 0;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: #6b7280;
      }

      .status-value {
        margin: 4px 0 0;
        font-weight: 700;
        font-size: 1rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(300px, 1fr);
        gap: 14px;
      }

      .panel {
        background: linear-gradient(180deg, var(--panel-gradient-a), var(--panel-gradient-b));
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        box-shadow: 0 14px 40px var(--shadow);
        padding: 16px;
        animation: fade-up 0.7s ease both;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .card-title {
        font-family: 'Space Grotesk', 'Outfit', sans-serif;
        font-size: 1.1rem;
      }

      .split {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .question {
        font-family: 'Space Grotesk', 'Outfit', sans-serif;
        font-size: clamp(1.15rem, 1.8vw, 1.5rem);
      }

      .meta {
        color: var(--muted);
        margin: 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.84rem;
        border: 1px solid transparent;
        font-weight: 600;
      }

      .chip.waiting {
        color: #6b4f00;
        background: #fff7df;
        border-color: #f4df9c;
      }

      .chip.live {
        color: #14532d;
        background: #e8f9ef;
        border-color: #b9ebca;
      }

      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .join-form {
        justify-content: flex-end;
      }

      input[type='text'] {
        flex: 1 1 180px;
        min-height: 42px;
        border: 1px solid #c6d4e6;
        border-radius: 11px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #0ea5a4;
        box-shadow: 0 0 0 3px rgba(14, 165, 164, 0.2);
      }

      .checkbox-row {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid #d4e1f0;
        border-radius: 11px;
        background: var(--surface);
        min-height: 42px;
        padding: 0 10px;
        color: var(--checkbox-text);
        font-size: 0.93rem;
        white-space: nowrap;
      }

      button {
        border: 0;
        border-radius: 11px;
        min-height: 42px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-deep));
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.2s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      button:disabled {
        cursor: not-allowed;
        background: #9ba8bb;
      }

      .alt-btn {
        background: linear-gradient(135deg, #d97706, #b45309);
      }

      .feed {
        height: 340px;
        overflow-y: auto;
        border-radius: 12px;
        border: 1px solid #cdd9e7;
        background: var(--surface);
        padding: 10px;
        display: grid;
        gap: 8px;
      }

      .message {
        border-radius: 10px;
        border: 1px solid #dce5f2;
        padding: 8px 10px;
        background: var(--surface-soft);
        font-size: 0.93rem;
        line-height: 1.4;
      }

      .message.local {
        border-color: #cde8d8;
        background: var(--surface-soft-alt);
      }

      .message .time {
        display: block;
        color: #6b7280;
        font-size: 0.73rem;
        margin-top: 3px;
      }

      .players {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .player {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        border: 1px solid #d8e4f1;
        border-radius: 12px;
        padding: 10px;
        background: var(--surface);
      }

      .theme-btn {
        background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
        min-width: 132px;
      }

      :where(button, input[type='text'], input[type='checkbox']):focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
      }

      button:focus:not(:focus-visible),
      input:focus:not(:focus-visible) {
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }

        button:hover:not(:disabled) {
          transform: none;
          filter: none;
        }
      }

      .player-name {
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .tag {
        font-size: 0.7rem;
        border-radius: 999px;
        color: #6c2f00;
        background: #ffedd5;
        border: 1px solid #fdba74;
        padding: 2px 7px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .score {
        color: #334155;
        font-size: 0.9rem;
        text-align: right;
      }

      .empty {
        color: #64748b;
        font-size: 0.92rem;
        padding: 6px 2px;
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .join-form {
          width: 100%;
          justify-content: flex-start;
        }

        .status-grid {
          grid-template-columns: repeat(2, minmax(130px, 1fr));
        }
      }

      @media (max-width: 560px) {
        .shell {
          padding: 14px 12px 26px;
          gap: 12px;
        }

        .hero,
        .panel {
          border-radius: 14px;
          padding: 12px;
        }

        .status-grid {
          grid-template-columns: 1fr;
        }

        input[type='text'],
        button,
        .checkbox-row {
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-row">
          <div>
            <h1 class="title">Guessing Arena</h1>
            <p class="subtitle">Create rounds, race the timer, and beat your friends live.</p>
          </div>

          <form id="join-form" class="join-form">
            <input id="name-input" type="text" placeholder="Enter your name" required />
            <label class="checkbox-row">
              <input id="master-checkbox" type="checkbox" />
              Join as Game Master
            </label>
            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle theme">
              Theme: Light
            </button>
            <button type="submit">Join Session</button>
          </form>
        </div>

        <div class="status-grid">
          <div class="status-card">
            <p class="status-label">Round Status</p>
            <p class="status-value" id="round-status">Waiting</p>
          </div>
          <div class="status-card">
            <p class="status-label">Timer</p>
            <p class="status-value" id="timer-meta">--</p>
          </div>
          <div class="status-card">
            <p class="status-label">Players Online</p>
            <p class="status-value"><span id="player-count">0</span></p>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel stack">
          <div class="split">
            <div class="stack" style="gap: 6px">
              <span class="chip waiting" id="state-chip">Session idle</span>
              <h2 class="question" id="question-title">Waiting to start...</h2>
              <p class="meta">Answer quickly before your attempts run out.</p>
            </div>
            <button id="start-btn" type="button" class="alt-btn" disabled>Start Session</button>
          </div>

          <div id="master-tools" class="stack" style="display: none">
            <h3 class="card-title">Game Master Controls</h3>
            <form id="question-form">
              <input id="question-input" type="text" placeholder="Type a question prompt" required />
              <input id="answer-input" type="text" placeholder="Correct answer" required />
              <button type="submit">Post Question</button>
            </form>
          </div>

          <div class="stack">
            <h3 class="card-title">Live Feed</h3>
            <div id="messages" class="feed" aria-live="polite"></div>
          </div>

          <div class="stack">
            <h3 class="card-title">Submit Your Answer</h3>
            <form id="answer-form">
              <input id="player-answer" type="text" placeholder="Enter your guess" required />
              <button id="submit-btn" type="submit" disabled>Send Answer</button>
            </form>
          </div>
        </section>

        <aside class="panel stack">
          <div class="split">
            <h3 class="card-title">Players</h3>
            <p class="meta"><span id="players-online">0</span> connected</p>
          </div>
          <ul id="players" class="players"></ul>
        </aside>
      </main>
    </div>

    <script>
      const socket = io();
      let myId = null;
      const joinForm = document.getElementById('join-form');
      const nameInput = document.getElementById('name-input');
      const masterCheckbox = document.getElementById('master-checkbox');
      const startBtn = document.getElementById('start-btn');
      const questionForm = document.getElementById('question-form');
      const questionInput = document.getElementById('question-input');
      const answerInput = document.getElementById('answer-input');
      const questionTitle = document.getElementById('question-title');
      const answerForm = document.getElementById('answer-form');
      const submitBtn = document.getElementById('submit-btn');
      const playerAnswer = document.getElementById('player-answer');
      const timerMeta = document.getElementById('timer-meta');
      const playersList = document.getElementById('players');
      const playerCount = document.getElementById('player-count');
      const playersOnline = document.getElementById('players-online');
      const messagesEl = document.getElementById('messages');
      const masterTools = document.getElementById('master-tools');
      const stateChip = document.getElementById('state-chip');
      const roundStatus = document.getElementById('round-status');
      const themeToggle = document.getElementById('theme-toggle');
      const THEME_KEY = 'guessing-game-theme';

      let joined = false;
      let isMaster = false;
      let currentQuestion = null;
      let lastResultSignature = '';

      initializeTheme();

      themeToggle.addEventListener('click', () => {
        const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        try {
          localStorage.setItem(THEME_KEY, nextTheme);
        } catch (error) {
          // Ignore storage failures and keep in-memory theme.
        }
      });

      socket.on('connect', () => {
        myId = socket.id;
      });

      joinForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!nameInput.value.trim()) return;

        const payload = { name: nameInput.value.trim(), isMaster: masterCheckbox.checked };
        socket.emit('player:join', payload, (resp) => {
          if (resp && resp.error) {
            pushMessage('Join failed: ' + resp.error, true);
            return;
          }

          joined = true;
          isMaster = masterCheckbox.checked;
          joinForm.querySelector('button').disabled = true;
          nameInput.disabled = true;
          masterCheckbox.disabled = true;
          startBtn.disabled = !isMaster;
          masterTools.style.display = isMaster ? 'grid' : 'none';
          pushMessage('You joined as ' + (isMaster ? 'Game Master.' : 'Player.'), true);
        });
      });

      startBtn.addEventListener('click', () => {
        socket.emit('game:start', null, (resp) => {
          if (resp && resp.error) pushMessage(resp.error, true);
        });
      });

      questionForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!questionInput.value.trim() || !answerInput.value.trim()) return;
        socket.emit(
          'question:create',
          { question: questionInput.value.trim(), answer: answerInput.value.trim() },
          (resp) => {
            if (resp && resp.error) {
              pushMessage(resp.error, true);
              return;
            }
            questionInput.value = '';
            answerInput.value = '';
          }
        );
      });

      answerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!currentQuestion) return;
        if (!playerAnswer.value.trim()) return;
        socket.emit('answer:submit', { answer: playerAnswer.value.trim() });
        playerAnswer.value = '';
      });

      socket.on('game:state', renderState);
      socket.on('players:update', renderPlayers);
      socket.on('timer:update', (seconds) => {
        timerMeta.textContent = seconds + 's';
      });
      socket.on('answer:result', ({ correct, attemptsLeft, gameOver }) => {
        const attemptMsg = typeof attemptsLeft === 'number' ? ' Attempts left: ' + attemptsLeft + '.' : '';
        const msg = correct ? 'Correct! You have won.' : ('Wrong.' + (gameOver ? '' : attemptMsg));
        pushMessage(msg.trim(), true);
      });
      socket.on('system:message', (msg) => pushMessage(msg, false));

      function renderState(state) {
        currentQuestion = state.currentQuestion;

        const currentCount = state.playerCount || 0;
        playerCount.textContent = String(currentCount);
        playersOnline.textContent = String(currentCount);

        const me = state.players && state.players.find((p) => p.id === myId);
        isMaster = Boolean(me && me.isMaster);
        startBtn.disabled = !isMaster || state.inProgress;
        masterTools.style.display = isMaster ? 'grid' : 'none';

        if (!state.inProgress) {
          questionTitle.textContent = 'Waiting to start...';
          submitBtn.disabled = true;
          timerMeta.textContent = '--';
          setStateVisual(false);

          if (state.result) {
            const winnerLine = state.result.winnerName ? 'Winner: ' + state.result.winnerName : 'No winner.';
            const answerLine = state.result.answer ? ' Answer: ' + state.result.answer : '';
            const signature = winnerLine + answerLine;
            if (signature !== lastResultSignature) {
              pushMessage((winnerLine + answerLine).trim(), false);
              lastResultSignature = signature;
            }
          }
          return;
        }

        setStateVisual(true);
        lastResultSignature = '';

        if (currentQuestion) {
          questionTitle.textContent = currentQuestion.prompt;
          submitBtn.disabled = !joined;
          timerMeta.textContent = (state.timeLeft || '--') + 's';
        } else {
          questionTitle.textContent = 'Waiting for next question...';
          submitBtn.disabled = true;
        }

        if (me && me.attemptsLeft <= 0) {
          submitBtn.disabled = true;
          pushMessage('No attempts left.', true);
        }

        if (state.result) {
          submitBtn.disabled = true;
        }
      }

      function renderPlayers(players = []) {
        playerCount.textContent = String(players.length);
        playersOnline.textContent = String(players.length);

        if (!players.length) {
          playersList.innerHTML = '<li class="empty">No players yet. Join to begin the action.</li>';
          return;
        }

        playersList.innerHTML = players
          .map((p) => {
            const safeName = escapeHtml(p.name || 'Player');
            const gmTag = p.isMaster ? '<span class="tag">GM</span>' : '';
            const score = (p.score || 0) + ' pts | ' + (p.attemptsLeft || 0) + ' tries';

            return (
              '<li class="player">' +
              '<span class="player-name">' +
              safeName +
              ' ' +
              gmTag +
              '</span>' +
              '<span class="score">' +
              escapeHtml(score) +
              '</span>' +
              '</li>'
            );
          })
          .join('');
      }

      function setStateVisual(inProgress) {
        stateChip.className = 'chip ' + (inProgress ? 'live' : 'waiting');
        stateChip.textContent = inProgress ? 'Round live' : 'Session idle';
        roundStatus.textContent = inProgress ? 'In Progress' : 'Waiting';
      }

      function pushMessage(text, isLocal) {
        const entry = document.createElement('article');
        entry.className = 'message' + (isLocal ? ' local' : '');

        const content = document.createElement('span');
        content.textContent = String(text);

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        entry.appendChild(content);
        entry.appendChild(time);
        messagesEl.appendChild(entry);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function initializeTheme() {
        let preferredTheme = 'light';

        try {
          const savedTheme = localStorage.getItem(THEME_KEY);
          if (savedTheme === 'light' || savedTheme === 'dark') {
            preferredTheme = savedTheme;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            preferredTheme = 'dark';
          }
        } catch (error) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            preferredTheme = 'dark';
          }
        }

        applyTheme(preferredTheme);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = 'Theme: ' + (theme === 'dark' ? 'Dark' : 'Light');
        themeToggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      }
    </script>
  </body>
</html>
